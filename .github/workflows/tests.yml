name: tests

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: pip install -r requirements-analysis.txt
      - name: Run all checks on simulated data
        run: python scripts/run_pipeline.py --sim
